name: Kantor Virtual - build & rilis

on:
  push:
    branches: [kantor-rico]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kantor-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: bash kantor/ci-run.sh "npm install" npm install --no-audit --no-fund

      - name: Build core & adapters
        run: |
          bash kantor/ci-run.sh "build core" npm run build --workspace=@agent-office/core
          bash kantor/ci-run.sh "build adapters" npm run build --workspace=@agent-office/adapters

      - name: Cek tipe server
        run: bash kantor/ci-run.sh "tsc server" npx tsc -p packages/server/tsconfig.json --noEmit

      - name: Build tampilan (UI)
        run: bash kantor/ci-run.sh "build ui" npm run build --workspace=@agent-office/ui

      - name: Satukan server jadi satu file
        run: |
          mkdir -p release
          bash kantor/ci-run.sh "esbuild" npx --yes esbuild@0.24.2 packages/server/src/index.ts \
            --bundle --platform=node --target=node20 \
            --tsconfig=packages/server/tsconfig.json \
            --loader:.py=text --loader:.sh=text \
            --external:sqlite3 --external:@whiskeysockets/baileys --external:pino --external:@napi-rs/canvas \
            --outfile=release/kantor-server.js
          # Thread terpisah untuk uji mundur mingguan (supaya server utama tetap lancar).
          bash kantor/ci-run.sh "esbuild uji" npx --yes esbuild@0.24.2 packages/server/src/ujiWorker.ts \
            --bundle --platform=node --target=node20 \
            --tsconfig=packages/server/tsconfig.json \
            --loader:.py=text --loader:.sh=text \
            --external:sqlite3 --external:@whiskeysockets/baileys --external:pino --external:@napi-rs/canvas \
            --outfile=release/kantor-uji-worker.js

      - name: Siapkan paket rilis
        run: |
          cp -r packages/ui/dist release/ui
          cp kantor/kantor.config.example.json release/
          cp kantor/env.example release/.env.example
          cp kantor/kantor-virtual.service release/
          cp kantor/README-KANTOR.md release/
          cp -r kantor/hermes-skills release/hermes-skills
          cp -r kantor/fonta release/fonta
          cp kantor/kantor-update.sh kantor/kantor-update.service kantor/kantor-update.timer release/
          chmod +x release/kantor-update.sh
          cd release
          npm init -y > /dev/null
          bash ../kantor/ci-run.sh "sqlite3" npm install sqlite3@5.1.7 --omit=dev --no-audit --no-fund
          bash ../kantor/ci-run.sh "sqlite3 load" node -e "require('sqlite3'); console.log('sqlite3 siap')"
          bash ../kantor/ci-run.sh "whatsapp" npm install @whiskeysockets/baileys@^6.7.16 pino@^9 --omit=dev --no-audit --no-fund
          bash ../kantor/ci-run.sh "whatsapp load" node -e "const B=require('@whiskeysockets/baileys'); if(typeof B.default!=='function') throw new Error('baileys'); require('pino'); console.log('whatsapp siap')"
          bash ../kantor/ci-run.sh "pdf" npm install pdfjs-dist@6.2.108 --omit=dev --no-audit --no-fund
          bash ../kantor/ci-run.sh "pdf load" node --input-type=module -e "const p = await import('pdfjs-dist/legacy/build/pdf.mjs'); if (typeof p.getDocument !== 'function') throw new Error('pdfjs'); console.log('pembaca PDF siap')"
          bash ../kantor/ci-run.sh "desain" npm install @napi-rs/canvas@1.1.1 --omit=dev --no-audit --no-fund
          bash ../kantor/ci-run.sh "desain load" node -e "const C=require('@napi-rs/canvas'); C.GlobalFonts.registerFromPath('fonta/Outfit.ttf','Outfit'); const c=C.createCanvas(200,100), g=c.getContext('2d'); g.font='800 40px Outfit'; g.fillText('Uji',10,60); if(c.toBuffer('image/png').length<200) throw new Error('canvas'); console.log('mesin desain siap')"
          cd ..
          tar czf kantor-virtual-linux-x64.tar.gz -C release .
          ls -lh kantor-virtual-linux-x64.tar.gz

      # ── FreeLLMAPI (router AI gratis, MIT, github.com/tashfeenahmed/freellmapi) ──
      # Dibangun sekali per versi yang dipatok (cache), dikirim sebagai paket terpisah. Gagal di sini tidak menghentikan rilis kantor.
      - name: Cache FreeLLMAPI
        id: freellm-cache
        uses: actions/cache@v4
        with:
          path: freellm-linux-x64.tar.gz
          key: freellm-9d2b4b407b12e489ecd35320cd630d5ff97cd666-node22-v1

      - name: Bangun FreeLLMAPI
        if: steps.freellm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -e
          git clone --filter=blob:none https://github.com/tashfeenahmed/freellmapi.git /tmp/freellm
          cd /tmp/freellm
          git checkout 9d2b4b407b12e489ecd35320cd630d5ff97cd666
          bash $GITHUB_WORKSPACE/kantor/ci-run.sh "freellm npm ci" npm ci --no-audit --no-fund
          bash $GITHUB_WORKSPACE/kantor/ci-run.sh "freellm build server" npm run build -w server
          bash $GITHUB_WORKSPACE/kantor/ci-run.sh "freellm build client" npm run build -w client
          npm prune --omit=dev --no-audit --no-fund
          node -e "require('better-sqlite3'); console.log('better-sqlite3 siap')"
          mkdir -p /tmp/freellm-paket/freellm/server /tmp/freellm-paket/freellm/client /tmp/freellm-paket/freellm/desktop
          cp -a package.json package-lock.json node_modules shared LICENSE /tmp/freellm-paket/freellm/
          cp -a server/package.json server/dist /tmp/freellm-paket/freellm/server/
          [ -d server/node_modules ] && cp -a server/node_modules /tmp/freellm-paket/freellm/server/ || true
          cp -a client/dist /tmp/freellm-paket/freellm/client/
          cp -a desktop/package.json /tmp/freellm-paket/freellm/desktop/
          echo "9d2b4b407b12e489ecd35320cd630d5ff97cd666" > /tmp/freellm-paket/freellm/VERSI
          tar czf $GITHUB_WORKSPACE/freellm-linux-x64.tar.gz -C /tmp/freellm-paket .
          ls -lh $GITHUB_WORKSPACE/freellm-linux-x64.tar.gz

      - name: Uji jalan sebentar (smoke test)
        run: |
          cd release
          mkdir -p /tmp/fakehermes/profiles/keuangan
          echo "description: Divisi Keuangan Pribadi" > /tmp/fakehermes/profiles/keuangan/profile.yaml
          HERMES_HOME=/tmp/fakehermes KANTOR_PASSWORD=tes-rahasia PORT=3999 node kantor-server.js > /tmp/smoke.log 2>&1 &
          sleep 8
          TOKEN=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"password":"tes-rahasia"}' http://127.0.0.1:3999/api/kantor/login | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])' || true)
          NOAUTH=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/api/kantor/status)
          if [ "$NOAUTH" != "401" ]; then echo "::error title=smoke test::status tanpa login harus 401, dapat $NOAUTH"; exit 1; fi
          if [ -z "$TOKEN" ] || ! curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:3999/api/kantor/status > /tmp/status.json || ! curl -sf http://127.0.0.1:3999/ | grep -qi "<html"; then
            msg="$(tail -40 /tmp/smoke.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=smoke test::${msg}"
            exit 1
          fi
          echo "::notice title=status kantor::$(cat /tmp/status.json | head -c 900)"
          kill %1 || true
          tail -20 /tmp/smoke.log

      - name: Terbitkan rilis uji "kantor-uji" (commit bertanda [uji] — TIDAK dipasang ke VPS)
        if: contains(github.event.head_commit.message, '[uji]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kantor-uji --yes --cleanup-tag || true
          gh release create kantor-uji kantor-virtual-linux-x64.tar.gz --target "$GITHUB_SHA" --title "Kantor Virtual (uji, belum dipasang)" --notes "Rilis uji dari commit $GITHUB_SHA — VPS tidak mengambil rilis ini." --prerelease

      - name: Terbitkan rilis "kantor-latest"
        if: ${{ !contains(github.event.head_commit.message, '[uji]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kantor-latest --yes --cleanup-tag || true
          EKSTRA=""; [ -f freellm-linux-x64.tar.gz ] && EKSTRA="freellm-linux-x64.tar.gz"
          gh release create kantor-latest kantor-virtual-linux-x64.tar.gz $EKSTRA \
            --target "$GITHUB_SHA" \
            --title "Kantor Virtual (terbaru)" \
            --notes "Paket siap pakai untuk VPS Linux x64 (Node 22). Dibangun dari commit $GITHUB_SHA." \
            --prerelease

      - name: Samakan cabang main (untuk Vercel)
        if: ${{ !contains(github.event.head_commit.message, '[uji]') }}
        run: |
          git fetch --no-tags origin main || true
          git push origin "$GITHUB_SHA:refs/heads/main" || echo "::warning::main tidak bisa disamakan otomatis"
