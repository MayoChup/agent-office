name: Kantor Virtual - build & rilis

on:
  push:
    branches: [kantor-rico]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kantor-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi
        run: bash kantor/ci-run.sh "npm install" npm install --no-audit --no-fund

      - name: Build core & adapters
        run: |
          bash kantor/ci-run.sh "build core" npm run build --workspace=@agent-office/core
          bash kantor/ci-run.sh "build adapters" npm run build --workspace=@agent-office/adapters

      - name: Cek tipe server
        run: bash kantor/ci-run.sh "tsc server" npx tsc -p packages/server/tsconfig.json --noEmit

      - name: Build tampilan (UI)
        run: bash kantor/ci-run.sh "build ui" npm run build --workspace=@agent-office/ui

      - name: Satukan server jadi satu file
        run: |
          mkdir -p release
          bash kantor/ci-run.sh "esbuild" npx --yes esbuild@0.24.2 packages/server/src/index.ts \
            --bundle --platform=node --target=node20 \
            --tsconfig=packages/server/tsconfig.json \
            --external:sqlite3 \
            --outfile=release/kantor-server.js

      - name: Siapkan paket rilis
        run: |
          cp -r packages/ui/dist release/ui
          cp kantor/kantor.config.example.json release/
          cp kantor/env.example release/.env.example
          cp kantor/kantor-virtual.service release/
          cp kantor/README-KANTOR.md release/
          cd release
          npm init -y > /dev/null
          bash ../kantor/ci-run.sh "sqlite3" npm install sqlite3@5.1.7 --omit=dev --no-audit --no-fund
          bash ../kantor/ci-run.sh "sqlite3 load" node -e "require('sqlite3'); console.log('sqlite3 siap')"
          cd ..
          tar czf kantor-virtual-linux-x64.tar.gz -C release .
          ls -lh kantor-virtual-linux-x64.tar.gz

      - name: Uji jalan sebentar (smoke test)
        run: |
          cd release
          mkdir -p /tmp/fakehermes/profiles/keuangan
          echo "description: Divisi Keuangan Pribadi" > /tmp/fakehermes/profiles/keuangan/profile.yaml
          HERMES_HOME=/tmp/fakehermes PORT=3999 node kantor-server.js > /tmp/smoke.log 2>&1 &
          sleep 8
          if ! curl -sf http://127.0.0.1:3999/api/kantor/status > /tmp/status.json || ! curl -sf http://127.0.0.1:3999/ | grep -qi "<html"; then
            msg="$(tail -40 /tmp/smoke.log | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=smoke test::${msg}"
            exit 1
          fi
          echo "::notice title=status kantor::$(cat /tmp/status.json | head -c 900)"
          kill %1 || true
          tail -20 /tmp/smoke.log

      - name: Terbitkan rilis "kantor-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete kantor-latest --yes --cleanup-tag || true
          gh release create kantor-latest kantor-virtual-linux-x64.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Kantor Virtual (terbaru)" \
            --notes "Paket siap pakai untuk VPS Linux x64 (Node 22). Dibangun dari commit $GITHUB_SHA." \
            --prerelease
