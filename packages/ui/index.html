<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <title>Kantor Virtual</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kantor" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Silkscreen&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
    <script>try { var t = localStorage.getItem('kantor:tema'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  </head>
  <body>
    <div id="phaser-container"></div>
    <div id="ui-root"><div id="muat-awal" style="position:fixed;inset:0;display:grid;place-items:center;font:500 15px/1.5 system-ui,sans-serif;color:#64748b;padding:24px;text-align:center"><div><div>Memuat kantor…</div><div id="muat-awal-aksi" style="display:none;margin-top:14px;max-width:320px"><div style="margin-bottom:10px">Belum terbuka juga. Mungkin sinyal lambat atau tersimpan versi lama.</div><button id="muat-awal-tombol" style="font:inherit;padding:10px 16px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#0f172a">Bersihkan & muat ulang</button></div></div></div></div>
    <script>
      // Kalau aplikasi belum tampil dalam 10 detik (atau berkas aplikasi gagal dimuat), tawarkan muat ulang bersih:
      // hapus simpanan service worker yang mungkin berisi versi lama/rusak, lalu muat ulang.
      (function () {
        function tawarkan() { var a = document.getElementById('muat-awal-aksi'); if (a) a.style.display = 'block'; }
        setTimeout(tawarkan, 10000);
        window.addEventListener('error', function (e) { if (e && e.target && e.target.tagName === 'SCRIPT') tawarkan(); }, true);
        document.addEventListener('click', function (e) {
          if (!e.target || e.target.id !== 'muat-awal-tombol') return;
          var tunggu = [];
          try { if (window.caches) tunggu.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (x) {}
          try { if (navigator.serviceWorker) tunggu.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (x) {}
          Promise.all(tunggu).then(function () { location.reload(); }, function () { location.reload(); });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
